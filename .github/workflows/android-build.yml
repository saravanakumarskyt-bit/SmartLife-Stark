
name: Build SmartLife Stark APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found in repository root"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"
          DIR=$(find "$RUNNER_TEMP/project" -name gradlew -type f -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -exec cp {} output/ \;
          if [ -z "$(ls -A output)" ]; then
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartLife-Stark-APK
          path: output/*.apk
          if-no-files-found: error
          
